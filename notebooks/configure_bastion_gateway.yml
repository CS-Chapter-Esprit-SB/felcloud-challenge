# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/playbook.json
---
- name: Configure Bastion Host as NAT Gateway
  hosts: bastion
  become: true

  vars:
    internal_if: ens4
    external_if: ens3
    harden_input: true      # replaces sg-bastion once port security is off
    internal_supernet: "10.0.0.0/16"

  tasks:
    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Set external network interface
      ansible.builtin.set_fact:
        ext_if: "{{ ansible_default_ipv4.interface }}"

    - name: Make sure the external and internal interfaces differ
      ansible.builtin.assert:
        that: ext_if != internal_if
        fail_msg: "Default route is on {{ internal_if }}; fix the bastion routing first."

    - name: Install iptables-persistent
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true

    # ---------------------------------------------------------------
    # Hairpin on ens3: HAProxy traffic enters and leaves the same NIC,
    # so the bastion must not tell clients to use the router directly.
    # ---------------------------------------------------------------
    - name: Stop sending ICMP redirects
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "0"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - net.ipv4.conf.all.send_redirects
        - net.ipv4.conf.default.send_redirects
        - "net.ipv4.conf.{{ ext_if }}.send_redirects"
    
    - name: Flush old FORWARD rules
      ansible.builtin.iptables:
        chain: FORWARD
        flush: true

    - name: Flush old NAT POSTROUTING rules
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        flush: true

    # ---------------------------------------------------------------
    # NAT
    # ---------------------------------------------------------------
    - name: Masquerade internal subnets to the PUBLIC internet only
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ item }}"
        destination: "! {{ internal_supernet }}"
        out_interface: "{{ ext_if }}"
        jump: MASQUERADE
        comment: "egress NAT {{ item }}"
      loop: ["{{ outbound_cidr }}", "{{ inbound_cidr }}"]
      notify: Save iptables rules

    # ---------------------------------------------------------------
    # FORWARD
    # ---------------------------------------------------------------
    - name: FORWARD - never route internal-to-internal traffic
      ansible.builtin.iptables:
        chain: FORWARD
        source: "{{ internal_supernet }}"
        destination: "{{ internal_supernet }}"
        jump: DROP
        comment: "internal routing belongs to Neutron"
      notify: Save iptables rules

    - name: FORWARD - outbound subnet to the internet
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ internal_if }}"
        out_interface: "{{ ext_if }}"
        source: "{{ outbound_cidr }}"
        destination: "! {{ internal_supernet }}"
        jump: ACCEPT
        comment: "outbound subnet egress"
      notify: Save iptables rules

    - name: FORWARD - inbound subnet to the internet (hairpin on ext_if)
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ ext_if }}"
        out_interface: "{{ ext_if }}"
        source: "{{ inbound_cidr }}"
        destination: "! {{ internal_supernet }}"
        jump: ACCEPT
        comment: "inbound subnet egress (hairpin)"
      notify: Save iptables rules

    - name: FORWARD - return traffic (both directions)
      ansible.builtin.iptables:
        chain: FORWARD
        ctstate: [RELATED, ESTABLISHED]
        jump: ACCEPT
        comment: "established return traffic"
      notify: Save iptables rules

    - name: FORWARD - default policy DROP
      ansible.builtin.iptables:
        chain: FORWARD
        policy: DROP
      notify: Save iptables rules
    # ---------------------------------------------------------------
    # INPUT firewall (replaces sg-bastion when port security is off)
    # Rules are added BEFORE the policy changes to DROP.
    # ---------------------------------------------------------------
    - name: INPUT - allow loopback
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT
        comment: "loopback"
      when: harden_input | bool
      notify: Save iptables rules

    - name: INPUT - allow established and related
      ansible.builtin.iptables:
        chain: INPUT
        ctstate: [RELATED, ESTABLISHED]
        jump: ACCEPT
        comment: "established"
      when: harden_input | bool
      notify: Save iptables rules

    - name: INPUT - allow SSH
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "22"
        jump: ACCEPT
        comment: "ssh"
      when: harden_input | bool
      notify: Save iptables rules

    - name: INPUT - allow DHCP replies
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: "68"
        jump: ACCEPT
        comment: "dhcp client"
      when: harden_input | bool
      notify: Save iptables rules

    - name: INPUT - allow ICMP from internal subnets
      ansible.builtin.iptables:
        chain: INPUT
        protocol: icmp
        source: "{{ item }}"
        jump: ACCEPT
        comment: "icmp internal"
      loop: ["{{ inbound_cidr }}", "{{ outbound_cidr }}"]
      when: harden_input | bool
      notify: Save iptables rules

    - name: INPUT - allow all from internal subnets
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ item }}"
        jump: ACCEPT
        comment: "internal subnets"
      loop: ["{{ inbound_cidr }}", "{{ outbound_cidr }}"]
      when: harden_input | bool
      notify: Save iptables rules

    - name: INPUT - default policy DROP
      ansible.builtin.iptables:
        chain: INPUT
        policy: DROP
      when: harden_input | bool
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save
      changed_when: true