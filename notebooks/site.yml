---
# =============================================================================
# Master Orchestration Playbook: site.yml
# =============================================================================

- name: Verify cluster connectivity
  hosts: all
  gather_facts: false

  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

- import_playbook: deploy_bastion.yml

- import_playbook: deploy_squid.yml

- import_playbook: deploy_ha_proxy.yml