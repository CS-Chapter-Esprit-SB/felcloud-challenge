---
- name: Deploy health-check web service on the client VM
  hosts: client_nodes
  become: true

  vars:
    health_port: 80
    health_message: "Alive"

  tasks:
    - name: Install the health-check server script
      ansible.builtin.copy:
        dest: /usr/local/bin/health_server.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          MESSAGE = b"{{ health_message }}\n"

          class Handler(BaseHTTPRequestHandler):
              def _respond(self, body=True):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(MESSAGE)))
                  self.end_headers()
                  if body:
                      self.wfile.write(MESSAGE)

              def do_GET(self):
                  self._respond()

              def do_HEAD(self):
                  self._respond(body=False)

              def log_message(self, fmt, *args):
                  pass  # keep the journal quiet; HAProxy checks every 2s

          ThreadingHTTPServer(("0.0.0.0", {{ health_port }}), Handler).serve_forever()
      notify: Restart health service

    - name: Install the systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/health-check.service
        mode: "0644"
        content: |
          [Unit]
          Description=Health check endpoint (returns {{ health_message }})
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/bin/python3 /usr/local/bin/health_server.py
          Restart=always
          RestartSec=2
          DynamicUser=yes
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          NoNewPrivileges=yes

          [Install]
          WantedBy=multi-user.target
      notify: Restart health service

    - name: Enable and start the health service
      ansible.builtin.systemd:
        name: health-check
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers so the service is current before testing
      ansible.builtin.meta: flush_handlers

    - name: Verify the endpoint answers locally
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ health_port }}/health"
        return_content: true
      register: health
      retries: 5
      delay: 2
      until: health.status == 200
      failed_when: health_message not in health.content

  handlers:
    - name: Restart health service
      ansible.builtin.systemd:
        name: health-check
        state: restarted
        daemon_reload: true