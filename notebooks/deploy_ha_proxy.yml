---
- name: Deploy HAProxy Cluster with Keepalived VRRP
  hosts: haproxy_nodes
  become: true

  vars:
    use_bastion_gateway: true         # true = default route via the bastion
    dns_servers: ["8.8.8.8", "1.1.1.1"]
    cluster_vip: "{{ haproxy_vip }}"    # inventory defines haproxy_vip, not cluster_vip
    vrrp_auth_pass: "FelHAP51"          # max 8 chars; move to ansible-vault
    internal_supernet: "10.0.0.0/16"

    keepalived_global_defs:
      - "enable_script_security"
      - "script_user root"

    keepalived_instances:
      VI_1:
        interface: "{{ network_interface }}"
        state: "{{ keepalived_role }}"
        virtual_router_id: 51
        priority: "{{ keepalived_priority }}"
        authentication:
          auth_type: PASS
          auth_pass: "{{ vrrp_auth_pass }}"
        unicast_src_ip: "{{ ansible_host }}"
        unicast_peers:
          - "{{ peer_ip }}"
        vips:
          - "{{ cluster_vip }}/{{ subnet_cidr.split('/')[1] }} dev {{ network_interface }}"
        track_scripts:
          - check_haproxy

    keepalived_scripts:
      check_haproxy:
        check_script: "/usr/bin/pgrep -x haproxy"
        interval: 2
        weight: -20

  pre_tasks:
    # 1. Optional: send internet traffic through the bastion
    - name: Route internet traffic through the bastion
      when: use_bastion_gateway | bool
      block:
        - name: Write netplan override with the bastion as default gateway
          ansible.builtin.copy:
            dest: /etc/netplan/99-haproxy-gateway.yaml
            mode: "0600"
            content: |
              network:
                version: 2
                ethernets:
                  {{ network_interface }}:
                    dhcp4: true
                    dhcp4-overrides:
                      use-routes: false
                      use-dns: false
                    routes:
                      - to: {{ internal_supernet }}
                        via: {{ neutron_router_ip }}
                      - to: default
                        via: {{ bastion_gateway }}
                      - to: 169.254.169.254/32
                        via: {{ neutron_router_ip | regex_replace('\.1$', '.2') }}
                      - to: {{ subnet_cidr }}
                        scope: link
                        table: 100
                      - to: default
                        via: {{ neutron_router_ip }}
                        table: 100
                    routing-policy:
                      - from: {{ cluster_vip }}/32
                        table: 100
                        priority: 100
                    nameservers:
                      addresses: {{ dns_servers }}
          register: gw_cfg

        - name: Apply netplan
          ansible.builtin.command: netplan apply
          when: gw_cfg.changed

        - name: Reconnect after network change
          ansible.builtin.meta: reset_connection

        - name: Wait for the node to come back
          ansible.builtin.wait_for_connection:
            timeout: 60

    # 2. Verify the internet path before installing anything
    - name: Check outbound connectivity
      ansible.builtin.command: ping -c2 -W3 8.8.8.8
      changed_when: false

    # 3. System prerequisites
    - name: Allow services to bind to non-local Virtual IPs
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: true
    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: true
    
    - name: Install openssl
      ansible.builtin.apt:
        name: openssl
        state: present
        update_cache: true

    - name: Ensure haproxy system group exists
      ansible.builtin.group:
        name: haproxy
        state: present
        system: true

    - name: Ensure haproxy system user exists
      ansible.builtin.user:
        name: haproxy
        group: haproxy
        system: true
        shell: /usr/sbin/nologin

    # 4. Certificates
    - name: Ensure HAProxy certs directory exists
      ansible.builtin.file:
        path: /etc/haproxy/certs
        state: directory
        owner: haproxy
        group: haproxy
        mode: '0750'

    - name: Generate SSL key and certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/haproxy/certs/haproxy.key
        -out /etc/haproxy/certs/haproxy.crt
        -subj "/CN=felcloud.esprit.tn"
      args:
        creates: /etc/haproxy/certs/haproxy.crt

    - name: Create combined PEM bundle for HAProxy
      ansible.builtin.shell: >
        cat /etc/haproxy/certs/haproxy.key /etc/haproxy/certs/haproxy.crt
        > /etc/haproxy/certs/haproxy.pem
      args:
        creates: /etc/haproxy/certs/haproxy.pem

    - name: Secure PEM bundle file permissions
      ansible.builtin.file:
        path: /etc/haproxy/certs/haproxy.pem
        owner: haproxy
        group: haproxy
        mode: '0600'

  roles:
    - role: evrardjp.keepalived

  tasks:
    - name: Deploy host-to-backend map
      ansible.builtin.template:
        src: hosts.map.j2
        dest: /etc/haproxy/hosts.map
        owner: root
        group: root
        mode: "0644"
      notify: Reload HAProxy

    - name: Deploy HAProxy configuration (validated before install)
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/haproxy -c -f %s"
      notify: Reload HAProxy

    - name: Make sure HAProxy is enabled and running
      ansible.builtin.systemd:
        name: haproxy
        enabled: true
        state: started

  handlers:
    - name: Reload HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: reloaded