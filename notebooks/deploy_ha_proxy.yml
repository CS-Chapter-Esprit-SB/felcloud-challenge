---
- name: Deploy HAProxy Cluster with Keepalived VRRP
  hosts: haproxy_nodes
  become: true

  vars:
    iface: "{{ ansible_default_ipv4.interface }}"
    squid_proxy_url: "http://{{ squid_vip }}:3128"
    # Keepalived only uses the first 8 characters of a PASS secret.
    vrrp_auth_pass: "FelHaPrx"

  pre_tasks:
    # These nodes have no direct internet egress (security group), so apt goes
    # through the Squid VIP. deploy_ha_squid.yml must have run first.
    - name: Send apt through the Squid forward proxy
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/95proxy
        mode: '0644'
        content: |
          Acquire::http::Proxy "{{ squid_proxy_url }}";
          Acquire::https::Proxy "{{ squid_proxy_url }}";

    - name: Allow services to bind to non-local Virtual IPs
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: true

  tasks:
    - name: Install HAProxy and Keepalived
      ansible.builtin.apt:
        name:
          - haproxy
          - keepalived
        state: present
        update_cache: true

    - name: Ensure HAProxy certs directory exists
      ansible.builtin.file:
        path: /etc/haproxy/certs
        state: directory
        owner: haproxy
        group: haproxy
        mode: '0750'

    - name: Generate self-signed SSL key and certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/haproxy/certs/haproxy.key
        -out /etc/haproxy/certs/haproxy.crt
        -subj "/CN=felcloud.esprit.tn"
      args:
        creates: /etc/haproxy/certs/haproxy.crt

    - name: Create combined PEM bundle for HAProxy
      ansible.builtin.shell: >
        cat /etc/haproxy/certs/haproxy.key /etc/haproxy/certs/haproxy.crt > /etc/haproxy/certs/haproxy.pem
      args:
        creates: /etc/haproxy/certs/haproxy.pem

    - name: Secure PEM bundle file permissions
      ansible.builtin.file:
        path: /etc/haproxy/certs/haproxy.pem
        owner: haproxy
        group: haproxy
        mode: '0600'

    # validate: a config that does not pass `haproxy -c` is never installed.
    - name: Configure HAProxy
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
        validate: haproxy -c -f %s
        content: |
          global
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin
              user haproxy
              group haproxy
              daemon
              maxconn 4096

          defaults
              log global
              mode http
              option httplog
              timeout connect 5s
              timeout client 30s
              timeout server 30s

          frontend http-in
              bind *:80
              http-request redirect scheme https code 301

          frontend https-in
              bind *:443 ssl crt /etc/haproxy/certs/haproxy.pem
              default_backend app-backend

          backend app-backend
              balance roundrobin
              option httpchk GET /
              server app1 {{ app_backend_ip }}:80 check
      notify: Reload HAProxy

    # Health = "accepts a TCP connection on localhost", not "process exists": a stopping
    # or hung service keeps its process but refuses connections.
    - name: Install the Keepalived port health check
      ansible.builtin.copy:
        dest: /usr/local/bin/check_local_port
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Exit 0 if something accepts TCP connections on 127.0.0.1:$1 within 1 second.
          exec timeout 1 bash -c "</dev/tcp/127.0.0.1/$1"

    - name: Configure Keepalived for the HAProxy VIP
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        mode: '0644'
        content: |
          global_defs {
              enable_script_security
              script_user root
          }

          # A dead HAProxy moves the VIP, not just a dead VM: the healthy node gets
          # +2 priority, so MASTER (101+2) drops below BACKUP (100+2) when it fails.
          vrrp_script check_haproxy {
              script "/usr/local/bin/check_local_port 443"
              interval 1
              weight 2
          }

          vrrp_instance VI_HAPROXY {
              state {{ keepalived_role }}
              interface {{ iface }}
              virtual_router_id 51
              priority {{ keepalived_priority }}
              advert_int 1

              authentication {
                  auth_type PASS
                  auth_pass {{ vrrp_auth_pass }}
              }

              unicast_src_ip {{ ansible_host }}
              unicast_peer {
                  {{ peer_ip }}
              }

              virtual_ipaddress {
                  {{ haproxy_vip }}/24 dev {{ iface }}
              }

              track_script {
                  check_haproxy
              }
          }
      notify: Restart Keepalived

    - name: Enable and start HAProxy and Keepalived
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - haproxy
        - keepalived

  handlers:
    - name: Reload HAProxy
      ansible.builtin.service:
        name: haproxy
        state: reloaded

    - name: Restart Keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
