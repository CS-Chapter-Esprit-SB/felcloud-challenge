---
- name: Deploy High-Availability Squid Forward Proxy Cluster
  hosts: squid_nodes
  become: true

  vars:
    iface: "{{ ansible_default_ipv4.interface }}"
    # Keepalived only uses the first 8 characters of a PASS secret.
    vrrp_auth_pass: "FelSquid"
    squid_port: 3128
    # Allowed internal subnet range (your openstack subnets)
    allowed_internal_cidrs:
      - "10.0.0.0/16"

    # Whitelisted domains allowed for outbound egress
    allowed_domains:
      - ".github.com"
      - ".githubusercontent.com"
      - ".python.org"
      - ".pypi.org"
      - ".ubuntu.com"

  pre_tasks:
    # 1. Enable Non-Local IP Binding so Squid/Keepalived can bind to VIP on the backup node
    - name: Enable ip_nonlocal_bind in sysctl
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: true

    # 2. Install Squid and Keepalived
    - name: Install Squid and Keepalived
      ansible.builtin.apt:
        name:
          - squid
          - keepalived
        state: present
        update_cache: true

  tasks:
    # 3. Create Whitelisted Domains List
    - name: Create Squid ACL allowed domains configuration
      ansible.builtin.copy:
        dest: /etc/squid/allowed_domains.acl
        mode: '0644'
        content: |
          {% for domain in allowed_domains %}
          {{ domain }}
          {% endfor %}
      notify: Reload Squid

    # 4. Configure Squid Proxy
    - name: Configure /etc/squid/squid.conf
      ansible.builtin.copy:
        dest: /etc/squid/squid.conf
        mode: '0644'
        content: |
          # Listening Port
          http_port {{ squid_port }}

          # Exit within 1 s on stop instead of waiting 30 s for open connections:
          # while stopping, Squid refuses new connections, so every second is an outage.
          shutdown_lifetime 1 seconds

          # Define Internal Networks ACL
          {% for cidr in allowed_internal_cidrs %}
          acl local_net src {{ cidr }}
          {% endfor %}

          # Define Whitelisted Domains ACL
          acl allowed_sites dstdomain "/etc/squid/allowed_domains.acl"

          # Access Control Rules
          http_access allow local_net allowed_sites
          http_access deny all

          # Privacy & Anonymity Headers
          via off
          forwarded_for delete

          # Disk & Cache Settings
          cache_dir ufs /var/spool/squid 100 16 256
          coredump_dir /var/spool/squid
      notify: Restart Squid

    # Health = "accepts a TCP connection on localhost", not "process exists": a stopping
    # or hung service keeps its process but refuses connections.
    - name: Install the Keepalived port health check
      ansible.builtin.copy:
        dest: /usr/local/bin/check_local_port
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Exit 0 if something accepts TCP connections on 127.0.0.1:$1 within 1 second.
          exec timeout 1 bash -c "</dev/tcp/127.0.0.1/$1"

    # 5. Configure Keepalived VRRP for Squid VIP
    - name: Configure Keepalived for Squid VIP
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        mode: '0644'
        content: |
          global_defs {
              enable_script_security
              script_user root
          }

          vrrp_script check_squid {
              script "/usr/local/bin/check_local_port 3128"
              interval 1
              weight 2
          }

          vrrp_instance VI_SQUID {
              state {{ keepalived_role }}
              interface {{ iface }}
              virtual_router_id 52
              priority {{ keepalived_priority }}
              advert_int 1

              authentication {
                  auth_type PASS
                  auth_pass {{ vrrp_auth_pass }}
              }

              unicast_src_ip {{ ansible_host }}
              unicast_peer {
                  {{ peer_ip }}
              }

              virtual_ipaddress {
                  {{ squid_vip }}/24 dev {{ iface }}
              }

              track_script {
                  check_squid
              }
          }
      notify: Restart Keepalived

  handlers:
    - name: Reload Squid
      ansible.builtin.service:
        name: squid
        state: reloaded

    - name: Restart Squid
      ansible.builtin.service:
        name: squid
        state: restarted
        enabled: true

    - name: Restart Keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
        enabled: true