[project]
name = "felcloud-challenge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ansible>=14.4.0",
    "fastapi>=0.156.1",
    "openstacksdk>=4.21.0",
    "psycopg[binary]>=3.3.6",
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-command>=1.2.1",
    "pulumi-openstack>=5.5.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]
[tool.basedpyright]
ignore = [
    "./resources/sandboxes/tools/Preflight.py"
]
reportExplicitAny = false
reportUnknownVariableType = false
reportAny=false
reportUnknownArgumentType=false
