services:
  monitoring-api:
    build:
      context: .
      dockerfile: Dockerfile.api

    image: sandbox-monitor-api:latest
    container_name: sandbox-monitor-api

    restart: unless-stopped
    network_mode: host

    env_file:
      - .env

  monitoring-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer

    image: sandbox-monitor-consumer:latest
    container_name: sandbox-monitor-consumer

    restart: unless-stopped
    network_mode: host

    env_file:
      - .env

    volumes:
      - /var/log/remote-haproxy.log:/var/log/remote-haproxy.log:ro
      - /home/ubuntu/.config/openstack/clouds.yaml:/home/app/.config/openstack/clouds.yaml:ro

    environment:
      HOME: /home/app
      OS_CLOUD: felcloud
      OS_CLIENT_CONFIG_FILE: /home/app/.config/openstack/clouds.yaml